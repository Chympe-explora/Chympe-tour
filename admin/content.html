<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Site Content — Admin</title>
<link rel="stylesheet" href="../dashboard-assets/common.css" />
<script src="config.js"></script>
<style>
  .tree { font-size: 13px; }
  .tree-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--card-border); }
  .tree-row.dim { opacity: 0.35; }
  .tree-key { color: var(--muted); min-width: 160px; word-break: break-all; }
  .tree-val { flex: 1; word-break: break-word; }
  .tree-indent { border-left: 1px solid var(--card-border); margin-left: 8px; padding-left: 10px; }
  .chip { display: inline-flex; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--card-border); background: var(--card); font-size: 12px; cursor: pointer; }
  .chip.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }
</style>
</head>
<body>
<script src="../dashboard-assets/common.js"></script>
<script>
  DASH.requireAuth();
  const root = DASH.renderShell({ title: "Site Content" });
  root.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Website Content Editor</h2></div>
      <div class="row">
        <div style="flex:1;min-width:140px"><label>Site</label><select id="siteSel"></select></div>
        <div style="flex:1;min-width:140px"><label>Section</label>
          <select id="kindSel">
            <option value="content">Text & Pages</option>
            <option value="images">Images</option>
            <option value="prices">Prices</option>
            <option value="highlights">Highlights</option>
            <option value="ratings">Ratings</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="muted" style="align-self:center;font-size:12px">Quick jump:</span>
        <span class="chip" data-filter="background">🖼️ Background</span>
        <span class="chip" data-filter="section">📑 Sections</span>
        <span class="chip" data-filter="button">🔘 Hero Button</span>
        <span class="chip" data-filter="font,color">🎨 Fonts & Colors</span>
        <span class="chip" data-filter="">✖ Clear</span>
        <input id="freeFilter" placeholder="or type to filter by key…" style="flex:1;min-width:160px" />
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Fields</h2><span class="muted" id="pathHint">Tap ✏️ next to a field to edit it</span></div>
      <div class="tree" id="treeRoot"><div class="empty">Choose a site & section above.</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Advanced: Raw JSON (bulk edit)</h2></div>
      <div class="muted" style="margin-bottom:8px">For power users — replaces the ENTIRE section for this site. Malformed JSON will be rejected.</div>
      <textarea id="rawJson" style="min-height:180px"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="rawSave">Save Raw JSON</button>
        <button class="btn secondary" id="rawReload">Reload</button>
      </div>
      <div class="err" id="rawErr"></div>
      <div class="ok-msg" id="rawOk"></div>
    </div>
  `;

  let currentFilter = [];
  let currentMerged = null;
  let currentKey = "";

  async function loadSites() {
    const { sites } = await DASH.apiFetch("/api/admin/sites");
    document.getElementById("siteSel").innerHTML = sites.map((s) => `<option value="${s.id}">${DASH.escapeHtml(s.label)}</option>`).join("");
  }

  function matchesFilter(key) {
    if (!currentFilter.length) return true;
    const k = key.toLowerCase();
    return currentFilter.some((f) => k.includes(f));
  }

  function renderNode(obj, pathPrefix, depth) {
    if (obj === null || typeof obj !== "object") {
      return "";
    }
    let html = "";
    for (const [k, v] of Object.entries(obj)) {
      const fullPath = pathPrefix ? `${pathPrefix}.${k}` : k;
      const isLeaf = v === null || typeof v !== "object";
      const dim = !matchesFilter(fullPath) ? " dim" : "";
      if (isLeaf) {
        html += `<div class="tree-row${dim}">
          <div class="tree-key">${DASH.escapeHtml(fullPath)}</div>
          <div class="tree-val" id="val-${DASH.escapeHtml(fullPath)}">${DASH.escapeHtml(String(v))}</div>
          <button class="btn sm secondary" data-edit="${DASH.escapeHtml(fullPath)}">✏️</button>
          <button class="btn sm ghost" data-reset="${DASH.escapeHtml(fullPath)}">↺</button>
        </div>`;
      } else {
        html += `<div class="tree-row${dim}" style="font-weight:600">${DASH.escapeHtml(fullPath)}</div>
          <div class="tree-indent">${renderNode(v, fullPath, depth + 1)}</div>`;
      }
    }
    return html || '<div class="muted">(empty)</div>';
  }

  function wireTreeButtons() {
    document.querySelectorAll("[data-edit]").forEach((b) =>
      b.addEventListener("click", async () => {
        const p = b.dataset.edit;
        const current = document.getElementById(`val-${CSS.escape(p)}`).textContent;
        const next = prompt(`New value for:\n${p}`, current);
        if (next === null) return;
        let value = next;
        if (next === "true" || next === "false") value = next === "true";
        else if (next !== "" && !isNaN(next)) value = Number(next);
        await DASH.apiFetch("/api/admin/doc/path", { method: "POST", body: JSON.stringify({ key: currentKey, path: p, value }) }).catch((e) => alert(e.message));
        loadTree();
      })
    );
    document.querySelectorAll("[data-reset]").forEach((b) =>
      b.addEventListener("click", async () => {
        if (!confirm(`Reset "${b.dataset.reset}" to the site default?`)) return;
        await DASH.apiFetch("/api/admin/doc/reset-path", { method: "POST", body: JSON.stringify({ key: currentKey, path: b.dataset.reset }) }).catch((e) => alert(e.message));
        loadTree();
      })
    );
  }

  async function loadTree() {
    const site = document.getElementById("siteSel").value;
    const kind = document.getElementById("kindSel").value;
    currentKey = `${kind}:${site}`;
    const treeEl = document.getElementById("treeRoot");
    treeEl.innerHTML = '<div class="empty">Loading…</div>';
    try {
      const { merged } = await DASH.apiFetch(`/api/admin/doc?key=${encodeURIComponent(currentKey)}`);
      currentMerged = merged;
      treeEl.innerHTML = renderNode(merged, "", 0);
      wireTreeButtons();
      document.getElementById("rawJson").value = JSON.stringify(merged, null, 2);
    } catch (e) {
      treeEl.innerHTML = `<div class="empty">${DASH.escapeHtml(e.message)}</div>`;
    }
  }

  document.getElementById("siteSel").addEventListener("change", loadTree);
  document.getElementById("kindSel").addEventListener("change", loadTree);
  document.querySelectorAll(".chip").forEach((chip) =>
    chip.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      const f = chip.dataset.filter;
      currentFilter = f ? f.split(",") : [];
      document.getElementById("freeFilter").value = "";
      if (currentMerged) {
        document.getElementById("treeRoot").innerHTML = renderNode(currentMerged, "", 0);
        wireTreeButtons();
      }
    })
  );
  document.getElementById("freeFilter").addEventListener("input", (e) => {
    currentFilter = e.target.value ? [e.target.value.toLowerCase()] : [];
    if (currentMerged) {
      document.getElementById("treeRoot").innerHTML = renderNode(currentMerged, "", 0);
      wireTreeButtons();
    }
  });

  document.getElementById("rawSave").addEventListener("click", async () => {
    const errEl = document.getElementById("rawErr");
    const okEl = document.getElementById("rawOk");
    errEl.textContent = "";
    okEl.textContent = "";
    let value;
    try {
      value = JSON.parse(document.getElementById("rawJson").value);
    } catch {
      return (errEl.textContent = "That isn't valid JSON.");
    }
    try {
      await DASH.apiFetch("/api/admin/doc/replace", { method: "POST", body: JSON.stringify({ key: currentKey, value }) });
      okEl.textContent = "Saved.";
      loadTree();
    } catch (e) {
      errEl.textContent = e.message;
    }
  });
  document.getElementById("rawReload").addEventListener("click", loadTree);

  loadSites().then(loadTree);

  // support ?jump=fonts style links from the dashboard home page
  const jump = new URLSearchParams(location.search).get("jump");
  if (jump === "fonts") setTimeout(() => document.querySelector('[data-filter="font,color"]')?.click(), 400);
</script>
</body>
</html>
